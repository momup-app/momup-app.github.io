name: Sync events from Instagram

on:
  schedule:
    - cron: "7 * * * *" # every hour, at minute 7
  workflow_dispatch: # "Run workflow" button in the Actions tab

permissions:
  contents: write
  pages: write

concurrency:
  group: instagram-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test the caption reader
        run: node --test scripts/

      - name: Read Instagram and update events
        run: node scripts/instagram-sync.mjs
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}

      - name: Publish changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data/ && [ -z "$(git status --porcelain data/)" ]; then
            echo "Nothing new."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.json data/geocode-cache.json
          git commit -m "Sync events from Instagram"
          git push
          # Pushes made by this workflow don't always start a Pages build, so ask for one.
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" > /dev/null \
            || echo "::warning::Couldn't request a Pages build; the site updates on the next push."
