name: Refresh Instagram token

# Instagram access tokens expire after 60 days unless refreshed.
# This renews it twice a month and saves the new one as the IG_ACCESS_TOKEN secret.

on:
  schedule:
    - cron: "0 6 1,15 * *" # 06:00 UTC on the 1st and 15th
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh and save the token
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
        run: |
          if [ -z "$IG_ACCESS_TOKEN" ]; then
            echo "::notice::IG_ACCESS_TOKEN is not set yet. See docs/instagram-sync.md."
            exit 0
          fi
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Add the REPO_ADMIN_TOKEN secret so the renewed token can be saved (docs/instagram-sync.md, step 5)."
            exit 1
          fi
          resp=$(curl -sS --get "https://graph.instagram.com/refresh_access_token" \
            --data-urlencode "grant_type=ig_refresh_token" \
            --data-urlencode "access_token=${IG_ACCESS_TOKEN}")
          new=$(echo "$resp" | jq -r '.access_token // empty')
          if [ -z "$new" ]; then
            echo "::error::Instagram refused to refresh the token: $(echo "$resp" | jq -r '.error.message // "unknown error"'). Create a new one (docs/instagram-sync.md, step 3)."
            exit 1
          fi
          echo "::add-mask::$new"
          gh secret set IG_ACCESS_TOKEN --repo "$GITHUB_REPOSITORY" --body "$new"
          echo "Token renewed, valid for $(( $(echo "$resp" | jq -r '.expires_in') / 86400 )) more days."
